<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>DEX DESIGN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>

        <!-- LOGIN SCREEN -->
        <section id="licenseScreen" class="screen active">

            <div class="brand">

                <div class="brand-logo">
                    DX
                </div>

                <div class="brand-text">
                    DEX DESIGN
                </div>

            </div>

            <div class="license-box">

                <div class="license-icon">
                    ✦
                </div>

                <h1>
                    ورود به برنامه
                </h1>

                <p>
                    برای ادامه، لایسنس خود را وارد کنید.
                </p>

                <div class="input-wrapper">

                    <input
                        id="licenseInput"
                        type="text"
                        placeholder="XXXX-XXXX-XXXX"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>

                <button
                    id="licenseButton"
                    type="button"
                >
                    ورود
                </button>

                <div
                    id="licenseMessage"
                    class="license-message"
                ></div>

            </div>

            <div class="footer-text">
                DEX DESIGN
            </div>

        </section>


        <!-- HOME SCREEN -->
        <section id="homeScreen" class="screen">

            <!-- HEADER -->

            <header class="home-header">

                <div class="score-box">

                    <div class="score-star">
                        ★
                    </div>

                    <div class="score-info">

                        <span>
                            امتیاز
                        </span>

                        <strong id="score">
                            0
                        </strong>

                    </div>

                </div>


                <div class="profile-mini">

                    <img
                        id="profilePhoto"
                        class="profile-photo"
                        alt="Profile"
                    >

                    <div
                        id="profileFallback"
                        class="profile-fallback"
                    >
                    </div>

                    <div class="profile-text">

                        <strong id="profileName">
                            کاربر
                        </strong>

                        <span id="profileUsername">
                            @username
                        </span>

                    </div>

                </div>

            </header>


            <!-- LEVEL -->

            <section class="level-section">

                <div class="level-ring">

                    <div class="level-content">

                        <strong>
                            A1
                        </strong>

                        <span>
                            beginner
                        </span>

                    </div>

                </div>

            </section>


            <!-- MENU -->

            <section class="home-menu">

                <button
                    class="menu-card"
                    data-page="achievements"
                >

                    <span class="menu-icon">
                        🏆
                    </span>

                    <span class="menu-title">
                        دستاوردها
                    </span>

                </button>


                <button
                    class="menu-card"
                    data-page="rewards"
                >

                    <span class="menu-icon">
                        🎁
                    </span>

                    <span class="menu-title">
                        جوایز
                    </span>

                </button>


                <button
                    class="menu-card"
                    data-page="points"
                >

                    <span class="menu-icon">
                        ★
                    </span>

                    <span class="menu-title">
                        دریافت امتیاز
                    </span>

                </button>


                <button
                    class="menu-card"
                    data-page="learning"
                >

                    <span class="menu-icon">
                        ◈
                    </span>

                    <span class="menu-title">
                        مسیر یادگیری
                    </span>

                </button>


                <button
                    class="menu-card"
                    data-page="upgrade"
                >

                    <span class="menu-icon">
                        ↑
                    </span>

                    <span class="menu-title">
                        ارتقای سطح
                    </span>

                </button>


                <button
                    class="menu-card"
                    data-page="guide"
                >

                    <span class="menu-icon">
                        ?
                    </span>

                    <span class="menu-title">
                        راهنما
                    </span>

                </button>

            </section>


            <div class="home-footer">
                DEX DESIGN
            </div>

        </section>

    </main>


    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="app.js"></script>

</body>

</html>
